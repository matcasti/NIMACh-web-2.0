<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Editor del sitio · NIM-ACh</title>
  <script>
    window.__ADMIN_TOKEN__ = "@@ADMIN_TOKEN@@";
    if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark-mode');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Sora:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="icon" href="/assets/images/logo.png" type="image/png">
</head>
<body>
  <header class="bar">
    <a class="bar-brand" href="/admin/" aria-label="Editor del sitio">
      <img src="/assets/images/logo.png" alt="" width="30" height="30">
      <span><strong>Editor del sitio</strong><small>NIM-ACh</small></span>
    </a>
    <span class="status" id="status" role="status" aria-live="polite"><i></i><span>Cargando…</span></span>
    <div class="bar-actions">
      <a class="btn" href="/index.html" target="_blank" rel="noopener" id="btn-preview">Ver el sitio ↗</a>
      <button class="btn btn-primary" id="btn-publish" type="button">Publicar<span class="hide-s">&nbsp;en la web</span><span class="count" id="pub-count" hidden></span></button>
    </div>
  </header>

  <div class="shell">
    <nav class="side" id="side" aria-label="Secciones"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/js/ui.js"></script>
  <script src="/js/lite.js"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
